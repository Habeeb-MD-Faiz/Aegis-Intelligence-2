name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: API starts with no configuration
        # A missing GROQ_API_KEY once crashed the whole API at boot. This
        # keeps that from regressing.
        working-directory: backend
        env:
          AEGIS_DB_FILE: /tmp/ci.db
          AEGIS_LEDGER_FILE: /tmp/ci-ledger.json
        run: python -c "import main; print(f'{len(main.app.routes)} routes')"

      - name: Injection demo runs clean
        working-directory: backend
        run: python demo_injection.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  agent-docs:
    name: Agent context in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AGENTS.md and CLAUDE.md must be identical
        # AGENTS.md is canonical; CLAUDE.md is a copy. This stops the two
        # sets of agent instructions from drifting apart.
        run: python scripts/sync_agent_docs.py --check

  ledger:
    name: Ledger integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the committed chain still verifies
        working-directory: backend
        run: |
          pip install --quiet pydantic python-dotenv
          python -c "
          import blockchain
          result = blockchain.verify_blockchain()
          print(result['message'], '| blocks:', result['blocks'])
          raise SystemExit(0 if result['valid'] else 1)
          "
