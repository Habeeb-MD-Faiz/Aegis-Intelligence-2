name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: API starts with no configuration
        # A missing GROQ_API_KEY once crashed the whole API at boot. This
        # keeps that from regressing.
        working-directory: backend
        env:
          AEGIS_DB_FILE: /tmp/ci.db
          AEGIS_LEDGER_FILE: /tmp/ci-ledger.json
        run: python -c "import main; print(f'{len(main.app.routes)} routes')"

      - name: Injection demo runs clean
        working-directory: backend
        run: python demo_injection.py

      - name: AGENTS.md and CLAUDE.md must be identical
        # AGENTS.md is canonical; CLAUDE.md is a copy. The script does the
        # comparison rather than `cmp` because it normalises line endings —
        # this repo is developed on Windows and a CRLF checkout would
        # otherwise fail a byte comparison that is not a real drift.
        #
        # Ledger integrity used to be a job of its own here, verifying a
        # blockchain.json that was committed to the repo. The ledger is no
        # longer tracked, and test_guard.py verifies a chain built from the
        # seed instead — which is the property that job was reaching for.
        run: python scripts/sync_agent_docs.py --check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
